name: Build APK

on:
  push:
    branches:
      - claude/remote-control-feature-QLoSs
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: examples/remote-control
        run: chmod +x gradlew 2>/dev/null || true && gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mto3-player-debug-apk
          path: examples/remote-control/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
